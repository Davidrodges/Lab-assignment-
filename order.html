<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoleMarket Kenya | Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">SoleMarket Kenya</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="gallery.html">Gallery</a>
        <a class="active" href="order.html">Order</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1 class="section-title">Shoe Order Form</h1>
    <p class="lead">Fill in your details and we will confirm availability and delivery costs.</p>

    <form id="orderForm" class="order-form" action="#" method="post" novalidate>
      <p id="formError" class="form-message error" aria-live="assertive"></p>
      <p id="formSuccess" class="form-message success" aria-live="polite"></p>
      <div class="form-grid">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" required />
          <small class="field-error" id="fullNameError"></small>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" placeholder="e.g. 07XXXXXXXX" required />
          <small class="field-error" id="phoneError"></small>
        </div>

        <div class="form-group">
          <label for="location">Delivery Location</label>
          <select id="location" name="location" required>
            <option value="">Select location</option>
            <option>Nairobi</option>
            <option>Mombasa</option>
            <option>Kisumu</option>
            <option>Nakuru</option>
            <option>Eldoret</option>
            <option>Other</option>
          </select>
          <small class="field-error" id="locationError"></small>
        </div>

        <div class="form-group">
          <label for="shoeType">Shoe Type</label>
          <select id="shoeType" name="shoeType" required>
            <option value="">Select shoe type</option>
            <option>Running Shoes</option>
            <option>Casual Sneakers</option>
            <option>Leather Loafers</option>
            <option>Chelsea Boots</option>
            <option>School Shoes</option>
          </select>
          <small class="field-error" id="shoeTypeError"></small>
        </div>

        <div class="form-group">
          <label for="condition">Condition</label>
          <div class="inline-options" id="condition">
            <label><input type="radio" name="condition" value="New" required /> New</label>
            <label><input type="radio" name="condition" value="Thrift" /> Thrift</label>
          </div>
          <small class="field-error" id="conditionError"></small>
        </div>

        <div class="form-group">
          <label for="size">Shoe Size (EU)</label>
          <input id="size" name="size" type="number" min="28" max="48" required />
          <small class="field-error" id="sizeError"></small>
        </div>

        <div class="form-group form-group-full">
          <label for="notes">Extra Notes</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Color preference, brand requests, or delivery instructions"></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Submit Order</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p>SoleMarket Kenya</p>
      <p>Phone: +254 700 123 456</p>
      <p>Email: hello@solemarket.co.ke</p>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
